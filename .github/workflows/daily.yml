name: Daily headlines + deploy

# Each edition is a US Eastern day and goes live at midnight Eastern (the page won't show a paper dated in the future).
# GitHub's scheduler often runs late or drops runs, so the build is attempted several times each evening.
# An attempt only spends Claude credit when the next paper doesn't exist yet; later attempts see it and skip.
on:
  schedule:
    - cron: "41 0 * * *"     # 8:41 pm EDT / 7:41 pm EST: prints tomorrow's paper
    - cron: "53 1 * * *"     # 9:53 pm EDT / 8:53 pm EST: retry
    - cron: "7 3 * * *"      # 11:07 pm EDT / 10:07 pm EST: retry
    - cron: "37 4 * * *"     # 12:37 am EDT / 11:37 pm EST: last chance (after midnight it builds the day that has started)
    - cron: "29 5 * * *"     # 1:29 am EDT / 12:29 am EST: catch-up
  workflow_dispatch:          # "Run workflow" button for a manual refresh
    inputs:
      date:
        description: "Edition date to build, e.g. 2026-10-31 (leave empty for the next paper by the clock)"
        type: string
        default: ""
      force:
        description: "Rebuild even if the paper already exists (spends Claude credit)"
        type: boolean
        default: false
  push:
    branches: [main]          # redeploy when you change the game

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Is the next paper already printed?
        id: check
        if: github.event_name != 'push'
        run: |
          day="${{ inputs.date }}"
          [ -n "$day" ] || day=$(python3 -c "
          import datetime as dt
          from zoneinfo import ZoneInfo
          et = dt.datetime.now(dt.timezone.utc).astimezone(ZoneInfo('America/New_York'))
          print((et + dt.timedelta(hours=4)).date().isoformat())")
          echo "$day" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "::error::bad edition date: $day"; exit 1; }
          echo "day=$day" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.force }}" != "true" ]; then
            if [ -f "data/$day.json" ]; then
              echo "Paper for $day already exists; nothing to build."
              echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set, so no paper can be built."; exit 1
          fi
          echo "Building the paper for $day."
          echo "build=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.check.outputs.build == 'true'
        with:
          python-version: "3.12"

      - name: Cache word vectors
        if: steps.check.outputs.build == 'true'
        uses: actions/cache@v4
        with:
          path: ~/glove
          key: glove-wiki-gigaword-50

      - name: Download word vectors
        if: steps.check.outputs.build == 'true'
        run: |
          mkdir -p ~/glove
          [ -f ~/glove/g50.gz ] || curl -sSL -o ~/glove/g50.gz \
            https://github.com/RaRe-Technologies/gensim-data/releases/download/glove-wiki-gigaword-50/glove-wiki-gigaword-50.gz

      - name: Build the headlines
        if: steps.check.outputs.build == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: GLOVE=~/glove/g50.gz python scripts/make_daily.py --date "${{ steps.check.outputs.day }}"

      - name: Check the paper is complete
        if: steps.check.outputs.build == 'true'
        run: |
          python3 - "${{ steps.check.outputs.day }}" <<'EOF'
          import json, sys
          day = sys.argv[1]
          d = json.load(open(f"data/{day}.json"))
          call = d.get("call", [])
          real = [x for x in call if x.get("real")]
          mapped = [x for x in real if isinstance(x.get("lat"), (int, float)) and isinstance(x.get("lng"), (int, float))]
          print(f"{day}: {len(real)} true + {len(call) - len(real)} fake in the Daily Dig, {len(mapped)} pinnable; {len(d.get('blank', []))} Fill the Blank")
          if d.get("date") != day or len(call) < 7 or len(mapped) < 5:
              sys.exit("::error::The new paper is incomplete; not publishing it.")
          EOF

      - name: Commit new data
        if: steps.check.outputs.build == 'true'
        run: |
          git config user.name "far-fetched-bot"
          git config user.email "far-fetched-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Daily headlines ${{ steps.check.outputs.day }}"
          git pull --rebase origin main
          git push

      # Publish the newest main, not the commit this run started from: a deploy queued behind a nightly build
      # would otherwise put the previous paper back up.
      - name: Use the newest main
        if: github.event_name == 'push' || steps.check.outputs.build == 'true'
        run: |
          git fetch --depth=1 origin main
          git reset --hard FETCH_HEAD
          git log -1 --format='Deploying %h %s'

      - uses: actions/configure-pages@v5
        if: github.event_name == 'push' || steps.check.outputs.build == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' || steps.check.outputs.build == 'true'
        with:
          path: .
      - id: deploy
        if: github.event_name == 'push' || steps.check.outputs.build == 'true'
        uses: actions/deploy-pages@v4
