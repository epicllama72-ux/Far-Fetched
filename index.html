<style>
:root{
  --bg:#0f1115;--card:#141821;--panel:#10131a;--line:#2a2f3b;--ink:#0a0c10;
  --text:#eef0f4;--dim:#8a91a3;--accent:#ffcc4d;--good:#4fbf6a;--bad:#e0506a;--cyan:#6fd3ff;--pink:#ff6b8b;
  --scan:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);
  --px:'Press Start 2P',ui-monospace,monospace;--vt:'VT323',ui-monospace,Menlo,monospace;

}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:22px/1.15 var(--vt);overflow-x:hidden;-webkit-font-smoothing:none}
#bg{position:fixed;left:0;top:0;z-index:-2;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges;image-rendering:pixelated}
#ruler{position:fixed;left:0;top:0;width:100%;height:100%;z-index:-1;pointer-events:none;overflow:hidden}
.tick{position:absolute;transform:translateY(-50%);font:16px/1 var(--vt);color:#c9cfdb;background:rgba(13,15,20,.8);padding:1px 4px;white-space:nowrap}

.app{max-width:560px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px))}
body.pinning .app{padding-bottom:calc(min(30vh,260px) + 96px)}

/* HUD */
.topline{position:relative;display:flex;align-items:center;gap:10px;margin:0 0 8px;font:10px/1 var(--px);letter-spacing:.14em;color:var(--dim);text-shadow:0 2px 0 #000}
.topline .logo{flex:1}

#menuBtn[aria-expanded="true"]{background:var(--accent);color:#2b2000}

#muteBtn.off{color:#5d6475}
#muteBtn.off::after{content:'';position:absolute;left:5px;right:5px;top:50%;height:2px;background:#ff5d73;transform:rotate(-45deg)}
#menu{position:absolute;left:0;top:38px;z-index:20;width:min(300px,calc(100vw - 32px));background:var(--card);background-image:var(--scan);border:2px solid var(--line);box-shadow:0 0 0 3px var(--ink),6px 6px 0 3px var(--ink);padding:10px;display:flex;flex-direction:column;gap:8px;text-shadow:none}

#menu button.on{background:var(--accent);color:#2b2000;box-shadow:inset -3px -3px 0 rgba(0,0,0,.25),inset 3px 3px 0 rgba(255,255,255,.25),0 0 0 2px var(--ink)}
#menu button small{font-size:16px;opacity:.75}
#mAmbState{color:var(--cyan);opacity:1!important}
#menu .how{font:17px/1.15 var(--vt);color:var(--dim);margin:2px 2px 0;letter-spacing:0}

.topline b{color:var(--accent);font-weight:400}
#streak{color:var(--accent)}
.hud{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-bottom:10px}
.panel{position:relative;background:var(--panel);background-image:var(--scan);border:2px solid var(--line);padding:7px 10px 5px;min-width:96px;clip-path:var(--notch)}
.panel.r{text-align:right}
.lbl{display:block;font:8px/1 var(--px);letter-spacing:.2em;color:#7d8494;margin-bottom:5px}
.val{display:block;font:32px/0.9 var(--vt);color:var(--cyan)}

@keyframes rise{0%{opacity:1;transform:translateY(8px)}70%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
.mid{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
#dots{display:flex;gap:2px;flex-wrap:nowrap;filter:drop-shadow(0 2px 0 #000)}
.dot{width:11px;height:11px;border:2px solid var(--ink);background:#2c3242;box-shadow:0 0 0 1px #4a5266}

/* Tabs and cards */

#card.flash{border-color:#ff5d73}
#card.shake{animation:shake .36s steps(6)}
@keyframes shake{0%,100%{transform:translateX(0)}17%{transform:translateX(-12px)}33%{transform:translateX(10px)}50%{transform:translateX(-8px)}67%{transform:translateX(6px)}83%{transform:translateX(-3px)}}
.kicker{margin:0 0 7px;font:8px/1.4 var(--px);letter-spacing:.18em;text-transform:uppercase;color:var(--pink)}
#headline{margin:0;font:26px/1.02 var(--vt);letter-spacing:.02em;font-weight:400;text-wrap:balance}

.redact{display:inline-block;height:.8em;background:#000;vertical-align:-.05em;box-shadow:inset 0 0 0 2px #2b2f3a}
.reveal{color:var(--accent)}
.fakeplace{color:var(--dim)}
#speed{display:flex;align-items:center;gap:8px;margin-top:9px}
#speed .trk{flex:1;height:6px;background:var(--ink);box-shadow:0 0 0 1px #3a4050}
#speed i{display:block;height:100%;width:100%;background:repeating-linear-gradient(90deg,var(--cyan) 0 6px,transparent 6px 8px)}

/* Buttons */
button{font:24px/1 var(--vt);cursor:pointer;border:0;border-radius:0;padding:12px 16px;color:var(--text)}
.chunky,.btns button,.primary{box-shadow:inset -4px -4px 0 rgba(0,0,0,.28),inset 4px 4px 0 rgba(255,255,255,.18),0 0 0 3px var(--ink)}
.chunky:active,.btns button:active,.primary:active{transform:translateY(2px);box-shadow:inset 4px 4px 0 rgba(0,0,0,.28),0 0 0 3px var(--ink)}

#bar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:4;width:min(560px,100%);padding:12px max(19px,calc(env(safe-area-inset-right,0px) + 3px)) calc(16px + env(safe-area-inset-bottom,0px)) max(19px,calc(env(safe-area-inset-left,0px) + 3px));background:linear-gradient(to top,rgba(10,12,16,.85) 55%,rgba(10,12,16,0))}

.btns{display:flex;gap:12px}

#btnReal{background:var(--good);color:#0b2a12}

#bar .primary{width:100%}

#feedback{background:var(--card);background-image:var(--scan);border:2px solid var(--line);padding:10px 14px;margin-bottom:12px;font:22px/1.1 var(--vt)}
#feedback b{font-weight:400;color:var(--accent)}

/* Map panel */
#mapWrap{position:fixed;left:50%;bottom:0;width:min(560px,100%);padding:0 16px calc(14px + env(safe-area-inset-bottom,0px));z-index:5;transform:translate(-50%,115%);transition:transform .35s steps(5) .5s}

/* Fill the Blank */
#timerWrap{display:flex;align-items:center;gap:10px;margin:4px 3px 12px}

.g.new{border-color:var(--accent)}
.g .w{flex:0 0 38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g .bar{flex:1;height:10px;background:var(--ink);overflow:hidden}
.g .bar i{display:block;height:100%}
.g .p{flex:0 0 48px;text-align:right;color:var(--dim)}

#final{background:var(--card);background-image:var(--scan);border:2px solid var(--line);padding:16px;clip-path:var(--notch)}
#finalLine{margin:0 0 6px;font:34px/1 var(--vt)}

#finalScoreLine b{font-weight:400;color:var(--pink);font-size:30px}
#grid{display:flex;gap:6px;margin:0 0 10px}
.sq{width:34px;height:34px;display:grid;place-items:center;font:24px/1 var(--vt);color:#0a0c10;border:2px solid var(--ink);box-shadow:0 0 0 1px #3a4050}
.sq.ok{background:var(--good)}.sq.no{background:var(--bad)}.sq.meh{background:#d9a441}.sq.fake{background:#5a6070;color:#eef0f4}
.legend{font:17px/1.15 var(--vt);color:var(--dim)}
#marks{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:3;overflow:hidden}
.mk{position:fixed;display:none;transform:translateY(-50%);background:none;border:0;padding:2px 4px;box-shadow:none;opacity:0;text-shadow:2px 0 #0a0c10,-2px 0 #0a0c10,0 2px #0a0c10,0 -2px #0a0c10,2px 2px #0a0c10,-2px -2px #0a0c10,2px -2px #0a0c10,-2px 2px #0a0c10}
.mk.on{opacity:1;animation:mkin .45s steps(5)}
@keyframes mkin{0%{transform:translateY(-50%) scale(.85);opacity:0}100%{transform:translateY(-50%) scale(1);opacity:1}}
.mk .mp{display:block;font:24px/1 var(--vt);color:var(--accent);font-weight:400}

.mk.R{text-align:left}.mk.L{text-align:right}
.mk.ok{border-color:var(--good)}.mk.meh{border-color:#d9a441}.mk.warm{border-color:#e07a3a}.mk.no{border-color:var(--bad)}.mk.fake{border-color:#4a8fe0}.mk.fooled{border-color:#ff5d73}
.mkd{position:fixed;display:none;width:10px;height:10px;transform:translateY(-50%);background:#8a91a3;border:2px solid #0a0c10;box-shadow:0 0 0 1px #fff}
.mkd.ok{background:var(--good)}.mkd.meh{background:#d9a441}.mkd.warm{background:#e07a3a}.mkd.no{background:var(--bad)}.mkd.fake{background:#4a8fe0}.mkd.fooled{background:#14161c;box-shadow:0 0 0 1px #ff5d73}
#skipRecap{display:none;position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;width:auto;margin:0;padding:10px 22px;font-size:22px}

/* top band keeps the art from fighting the HUD */
.app::before{content:'';position:fixed;left:0;right:0;top:0;height:112px;background:linear-gradient(var(--bg) 62%,rgba(15,17,21,0));z-index:-1;pointer-events:none}

/* Fill the Blank: input lives in the bottom bar */
#blankBar form{display:flex;align-items:center;gap:10px;margin:0}

.chip{font:20px/1 var(--vt);padding:5px 8px;background:#141821;border:2px solid var(--line);color:var(--text)}

.chip.hot b{color:var(--accent)}.chip.warm b{color:#e07a3a}.chip.mild b{color:var(--dim)}.chip.cold b{color:#6a7184}

/* compact results */
#final{padding:10px 14px}

/* ---------- Sound: small synthesized effects (Web Audio, no files) ---------- */
const Sound=(function(){
  let ctx=null, master=null, noiseBuf=null, rum=null, rumGain=null;
  const VOL=0.22;
  let muted=(()=>{ try{ return localStorage.getItem('ff_mute')==='1'; }catch(e){ return false; } })();
  function ensure(){
    if(ctx){ if(ctx.state==='suspended') ctx.resume(); return true; }
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
    try{ ctx=new AC(); }catch(e){ return false; }
    master=ctx.createGain(); master.gain.value=muted?0:VOL; master.connect(ctx.destination);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    return true;
  }
  function tone(f,dur,o){
    o=o||{}; if(!ctx||muted) return;
    const t0=ctx.currentTime+(o.at||0), osc=ctx.createOscillator(), g=ctx.createGain();
    osc.type=o.type||'square'; osc.frequency.setValueAtTime(f,t0);
    if(o.to) osc.frequency.exponentialRampToValueAtTime(o.to,t0+dur);
    g.gain.setValueAtTime(0.0001,t0); g.gain.linearRampToValueAtTime(o.vol||0.2,t0+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    osc.connect(g); g.connect(master); osc.start(t0); osc.stop(t0+dur+0.03);
  }
  function noise(dur,o){
    o=o||{}; if(!ctx||muted) return;
    const t0=ctx.currentTime+(o.at||0), s=ctx.createBufferSource(), f=ctx.createBiquadFilter(), g=ctx.createGain();
    s.buffer=noiseBuf; s.loop=true;
    f.type=o.type||'lowpass'; f.frequency.setValueAtTime(o.freq||800,t0); f.Q.value=o.q||0.7;
    if(o.to) f.frequency.exponentialRampToValueAtTime(o.to,t0+dur);
    g.gain.setValueAtTime(o.vol||0.2,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t0+dur+0.03);
  }
  const SFX={
    menu:()=>tone(520,0.04,{vol:0.1,type:'triangle'}),
    real:()=>{ tone(523,0.09,{vol:0.18}); tone(784,0.15,{vol:0.18,at:0.08}); },
    twist:()=>{ tone(392,0.12,{vol:0.16,type:'triangle'}); tone(294,0.22,{vol:0.16,type:'triangle',at:0.1}); },
    catchFake:()=>{ tone(880,0.07,{vol:0.16}); tone(1319,0.22,{vol:0.16,at:0.06}); },
    fooled:()=>{ tone(147,0.38,{type:'sawtooth',vol:0.14,to:82}); },
    jawDown:()=>tone(1300,0.6,{type:'sine',vol:0.15,to:260,at:0.05}),
    jawUp:()=>tone(260,0.5,{type:'sine',vol:0.14,to:1100,at:0.15}),
    pin:()=>{ tone(190,0.08,{type:'triangle',vol:0.24,to:95}); noise(0.05,{vol:0.12,freq:1400}); },
    lock:q=>{ const n=q>=0.75?4:q>=0.25?3:2; [523,659,784,1047].slice(0,n).forEach((f,i)=>tone(f,0.12,{vol:0.15,at:i*0.07})); },
    flip:()=>noise(0.18,{vol:0.1,freq:3200,type:'bandpass',q:0.8,to:900}),
    crunch:()=>{ noise(0.4,{vol:0.32,freq:700,to:110}); tone(72,0.32,{type:'triangle',vol:0.28,to:40}); },
    core:()=>{ [1047,1319,1568,2093].forEach((f,i)=>tone(f,0.28,{vol:0.11,type:'triangle',at:0.1+i*0.07})); },
    start:()=>{ tone(440,0.06,{vol:0.14}); tone(880,0.1,{vol:0.14,at:0.06}); },
    guess:c=>tone(220+c*700,0.09,{vol:0.13,type:c>=0.6?'square':'triangle'}),
    exact:()=>{ [659,784,988,1319].forEach((f,i)=>tone(f,0.14,{vol:0.15,at:i*0.06})); },
    tick:()=>tone(1250,0.03,{vol:0.07}),
    timeup:()=>tone(210,0.42,{type:'square',vol:0.12,to:120}),
    nope:()=>tone(160,0.1,{type:'square',vol:0.08}),
    fanfare:()=>{ [523,659,784,1047,784,1047].forEach((f,i)=>tone(f,0.16,{vol:0.13,at:i*0.11})); }
  };
  function play(name,arg){ if(muted||!ensure()) return; const f=SFX[name]; if(f) f(arg); }
  function rumble(level){
    if(!ctx) return;
    if(!rum){
      rum=ctx.createBufferSource(); rum.buffer=noiseBuf; rum.loop=true;
      const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=150;
      rumGain=ctx.createGain(); rumGain.gain.value=0;
      rum.connect(lp); lp.connect(rumGain); rumGain.connect(master); rum.start();
    }

  }
  function setMuted(m){
    muted=m; try{ localStorage.setItem('ff_mute',m?'1':'0'); }catch(e){}

     that fades into a low underground drone with drips as the camera descends. */
  let amb=null, ambOn=(()=>{ try{ return localStorage.getItem('ff_amb')!=='0'; }catch(e){ return true; } })();
  function startAmb(){
    if(amb||!ctx) return;
    const s=ctx.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
    const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=420; bp.Q.value=0.45;
    const g1=ctx.createGain(); g1.gain.value=0; s.connect(bp); bp.connect(g1); g1.connect(master); s.start();
    const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=52;
    const o2=ctx.createOscillator(); o2.type='sine'; o2.frequency.value=78;
    const g2=ctx.createGain(); g2.gain.value=0; o.connect(g2); o2.connect(g2); g2.connect(master); o.start(); o2.start();
    amb={g1,g2,bp,type:ctx.currentTime+1.5,phone:ctx.currentTime+14,drip:ctx.currentTime+3};
    setInterval(tickAmb,200);
  }
  function tickAmb(){
    if(!amb) return;
    const on=ambOn && !muted && !document.hidden, now=ctx.currentTime;
    const yMid=(typeof Scene!=='undefined' && Scene.camDepth) ? Scene.camDepth() : 0;
    const room=Math.max(0,Math.min(1,1-(yMid-70)/90));        // 1 in the room, 0 below the floor
    amb.g1.gain.setTargetAtTime(on?0.05*room:0,now,0.4);
    amb.g2.gain.setTargetAtTime(on?0.06*(1-room):0,now,0.6);
    amb.bp.frequency.setTargetAtTime(380+80*Math.sin(now*0.3),now,0.5);
    if(!on) return;
    if(room>0.35 && now>amb.type){
      const n=3+Math.floor(Math.random()*10);
      for(let i=0;i<n;i++) noise(0.012,{vol:0.05*room,freq:2600,type:'highpass',at:i*(0.07+Math.random()*0.05)});
      if(Math.random()<0.35) tone(2093,0.35,{type:'triangle',vol:0.025*room,at:n*0.1+0.05});
      amb.type=now+1.8+Math.random()*4.5;
    }
    if(room>0.35 && now>amb.phone){
      for(let b=0;b<2;b++) for(let k=0;k<10;k++){ tone(440,0.05,{type:'sine',vol:0.012*room,at:b*1.6+k*0.1}); tone(480,0.05,{type:'sine',vol:0.012*room,at:b*1.6+k*0.1+0.05}); }

    }
    if(room<0.6 && now>amb.drip){
      tone(1700+Math.random()*500,0.12,{type:'sine',vol:0.03*(1-room),to:900});
      amb.drip=now+2.5+Math.random()*5;
    }
  }
  function setAmbience(on){ ambOn=on; try{ localStorage.setItem('ff_amb',on?'1':'0'); }catch(e){} }
  const unlockAll=()=>{ if(ensure()) startAmb(); };
  return {play,rumble,unlock:unlockAll,setMuted,isMuted:()=>muted,setAmbience,ambience:()=>ambOn};
})();

/* ---------- State ---------- */
let S = null, map = null, layer = null, guessLL = null;

let KIND = (function(){ try{ const k=localStorage.getItem('ff_kind'); return (k==='blank'||k==='pol')?k:'call'; }catch(e){ return 'call'; } })();
function saveKey(kind){ return kind==='blank'?'ff_blank':kind==='pol'?'ff_pol':'ff_daily'; }
function modeName(kind){ return kind==='blank'?'Fill the Blank':kind==='pol'?'Politics':'Real or Fake'; }
const BLANK_MAX = 500, BLANK_SECS = 20;
const FAKE_PTS = 150, JAW_SCALE = 4000;   // caught fake; every mode's jaw is scaled to the same 3000-point world

function startGame(mode, kind){
  if(kind) KIND = kind;
  try{ localStorage.setItem('ff_kind',KIND); }catch(e){}
  stopTimer(); hideToast(); $('sheet').hidden=true;
  RECAP_ON=false; document.body.classList.remove('recap'); Scene.endRecap();
  const daily = mode === 'daily';
  const blank = KIND === 'blank', pol = KIND === 'pol';
  const r = daily ? rng(hash(todayKey()+KIND)) : Math.random;
  let rounds;
  if(daily && DAILY && (!pol || (DAILY.politics && DAILY.politics.length))) rounds = DAILY[blank?'blank':pol?'politics':'call'].slice();
  else if(daily && pol) rounds = pickRounds(rng(hash(todayKey()+'pol')),true,true);
  else if(daily){
    // built-in fallback: one shared shuffle so the two modes never show the same story
    const reals=shuffle(STORIES.filter(s=>s.real&&s.h&&s.cat!=='pol'&&!s._daily),rng(hash(todayKey())));
    const fakes=shuffle(STORIES.filter(s=>!s.real&&s.cat!=='pol'&&!s._daily),rng(hash(todayKey()+'f')));
    const spare=reals.slice(ROUNDS_REAL).filter(s=>s.h2);
    rounds = blank ? spare.concat(reals.slice(0,ROUNDS_REAL).filter(s=>s.h2)).slice(0,ROUND_LEN)
                   : shuffle(reals.slice(0,ROUNDS_REAL).concat(fakes.slice(0,ROUNDS_FAKE)),rng(hash(todayKey()+'o')));
  } else rounds = blank ? pickBlankRounds(r) : pickRounds(r,false);   // practice never uses today's stories
  const reals=rounds.filter(x=>x.real).length;
  S = {mode, kind:KIND, rounds, i:0, results:[], phase:'call', score:0,
       maxScore: blank ? rounds.length*BLANK_MAX : reals*(CALL_PTS+PIN_PTS)+(rounds.length-reals)*FAKE_PTS,
       maxJaw: blank ? rounds.length*BLANK_MAX : reals*(CALL_PTS+PIN_PTS)};
  S.jawK = Math.min(1, JAW_SCALE/Math.max(1,S.maxJaw));
  S.sig = hash(rounds.map(x=>x.h||x.h2||'').join('|'));
  let pending=null;
  if(daily){
    const saved = load(saveKey(KIND));
    if(saved && saved.date === dayKey() && saved.sig === S.sig && Array.isArray(saved.results) && saved.results.length<=rounds.length){
      S.results = saved.results;
      S.score = sumPts(S.results);
      S.i = S.results.length;
      pending = saved;
    }
  }
  $('mCall').classList.toggle('on',KIND==='call' && daily);
  $('mBlank').classList.toggle('on',blank && daily);
  $('mPol').classList.toggle('on',pol && daily);
  $('mPractice').classList.toggle('on',!daily);
  $('howText').innerHTML = blank
    ? 'Guess the hidden word in each true headline. The exact word scores up to <b>500</b>, more the faster you get it. Near misses pay a little, and every guess after your third costs 5%.'
    : 'Right call on a true story: up to <b>+100</b>, more for answering quickly. Catching a fake: <b>+150</b>. Fooled by a fake: <b>−150</b>. Then pin where the true story happened for up to <b>+400</b>. Points from true stories drop the jaw, and getting fooled pulls it back up.';
  renderStats();
  closeMenu();
  Scene.configure(Math.min(S.maxJaw,JAW_SCALE));
  Scene.setBest(bestM());
  Scene.reset();
  if(S.results.length) Scene.restore(jawPoints()*S.jawK);
  $('final').hidden = true; setBar('none');
  if(S.i >= S.rounds.length){ finish(true); return; }
  if(blank){ showBlankRound(pending && pending.live && pending.live.i===S.i ? pending.live : null); return; }
  // a call made before a reload is kept: no second guesses
  if(pending && pending.cur && pending.cur.i===S.i){
    S.cur=pending.cur; S.score+=S.cur.callPts;
    showRound(null,true);
    revealCall(S.rounds[S.i]);
    return;
  }
  const resume = pending && pending.shown && pending.shown.i===S.i ? pending.shown : null;
  if(resume){ showRound(resume); return; }
  showRound(null,true,true);          // fresh headline: ask if the player is ready
}

function startCallRound(){
  if(S.phase!=='ready' || S.kind==='blank') return;

function saveProgress(extra){

/* one colour language for the HUD strip, the results grid and the share text */
function resultClass(x){
  if(x.blank) return x.c>=0.999?'ok':x.c>=0.6?'meh':x.c>=0.3?'warm':'no';
  if(!x.real) return x.callOk?'fake':'fooled';
  if(!x.callOk) return 'no';
  const f=(x.pinPts||0)/PIN_PTS;
  return f>=0.75?'ok':f>=0.25?'meh':'warm';
}
const CLASS_EMOJI={ok:'🟩',meh:'🟨',warm:'🟧',no:'🟥',fake:'🟦',fooled:'⬛'};
const CLASS_TITLE={ok:'Great',meh:'Good',warm:'Far off',no:'Missed',fake:'Caught the fake',fooled:'Fooled'};

function renderDots(){
  $('dots').innerHTML = S.rounds.map((_,i)=>{
    let c='dot';
    if(i<S.results.length) c+=' '+resultClass(S.results[i]);
    else if(i===S.i) c+=' now';
    return '<div class="'+c+'"></div>';
  }).join('');
  { const ll=$('logList');
    if(ll){
      ll.innerHTML = S.results.length ? S.results.map((x,i)=>{
        const cls=resultClass(x);
        let txt, pts=x.callPts+(x.pinPts||0);
        if(x.blank) txt = x.callWord ? '“'+x.callWord+'”' : 'no guess';
        else if(!x.real) txt = x.callOk ? 'Caught a fake' : 'Fooled';
        else txt = !x.callOk ? 'Real · missed call' : (x.dist!=null ? Math.round(x.dist).toLocaleString()+' km off' : 'Real');
        return '<li class="'+cls+'"><i></i><span>'+(i+1)+'. '+txt+'</span><b>'+(pts<0?'−'+Math.abs(pts):'+'+pts)+'</b></li>';
      }).join('') : '<li class="empty">Nothing yet.</li>';
    } }
  $('roundLbl').textContent = 'HEADLINE '+Math.min(S.i+1,S.rounds.length)+'/'+S.rounds.length;
  const sc=$('score');
  if(S._shown!==undefined && S.score!==S._shown){
    const d=S.score-S._shown;
    sc.classList.remove('pop','up'); void sc.offsetWidth; sc.classList.add(d<0?'pop':'up');
    clearTimeout(S._popT); S._popT=setTimeout(()=>sc.classList.remove('pop','up'),450);
    const de=$('delta'); de.textContent=(d>0?'+':'−')+Math.abs(d); de.className=''; void de.offsetWidth; de.className='go'+(d>0?' plus':'');
  }
  S._shown=S.score;
  sc.textContent=fmtPts(S.score);
  Scene.setJaw(jawPoints()*S.jawK);
}

function fmtPts(n){ return n<0 ? '−'+Math.abs(n) : String(n); }

/* Bottom bar shows exactly one control group. */
function setBar(which){
  $('callBtns').hidden = which!=='call';
  $('btnStart').hidden = which!=='start';
  $('btnNext').hidden = which!=='next';
  $('blankBar').hidden = which!=='guess';
  $('endBtns').hidden = which!=='end';
}

const isDesk=()=>matchMedia('(min-width:1100px) and (min-height:600px)').matches;
/* Put the chin in the free band between the UI and the bottom bar (or the map panel). */
function aim(f){
  requestAnimationFrame(()=>{
    if(!S) return;
    if(isDesk()){ Scene.setSafeTop(document.querySelector('.topline').getBoundingClientRect().bottom+6); Scene.setFocus(f||0.6); return; }
    Scene.setSafeTop(document.querySelector('.hud').getBoundingClientRect().bottom+4);
    if(f){ Scene.setFocus(f); return; }
    let top=0;
    ['card','feedback','blankUI','final'].forEach(id=>{
      const e=$(id); if(e && !e.hidden && e.offsetParent!==null) top=Math.max(top,e.getBoundingClientRect().bottom);
    });
    const mw=$('mapWrap'), bar=$('bar');
    const barTop = [...bar.children].some(c=>!c.hidden) ? bar.getBoundingClientRect().top+10 : innerHeight;
    const bot = document.body.classList.contains('pinning') ? innerHeight-mw.offsetHeight : barTop;
    let ff = ((top+bot)/2)/innerHeight;
    if(bot-top<140) ff=(bot-50)/innerHeight;
    Scene.setFocus(ff);
  });
}

/* Points earned on TRUE stories drop the jaw a fixed distance per point; being fooled pulls it back up. */
const FOOL_JAW = 150;
function jawPoints(){
  const list=S.results.slice();
  if(S.cur && S.phase==='pin') list.push(S.cur);
  let p=0;
  list.forEach(x=>{
    if(x.real) p+=Math.max(0,x.callPts)+Math.max(0,x.pinPts||0);
    else if(!x.callOk) p-=FOOL_JAW;          // being fooled pulls the jaw back up
  });
  return Math.max(0,p);
}
/* Time to read first (1 s + 0.25 s per word), then −10 points a second, floor 40. */
function readGrace(st){ return 1+0.25*(st.h||'').split(/\s+/).length; }
function speedPts(sec,st){ return Math.round(CALL_PTS*Math.max(0.4,Math.min(1,1-(sec-readGrace(st))/10))); }
let SPEED_RAF=0;
function runSpeed(){
  cancelAnimationFrame(SPEED_RAF);
  const el=$('speed'), bar=el.querySelector('i'), lab=el.querySelector('span');
  let lastT=performance.now();
  const tick=()=>{
    if(!S || S.phase!=='call' || S.kind==='blank'){ return; }
    const now=performance.now();
    if(!$('menu').hidden) S.t0+=now-lastT;          // the clock stops while the menu is open
    lastT=now;
    const st=S.rounds[S.i], sec=(now-S.t0)/1000, pts=speedPts(sec,st);
    bar.style.width=(pts/CALL_PTS*100)+'%'; lab.textContent='+'+pts;
    SPEED_RAF=requestAnimationFrame(tick);
  };
  tick();
}

function showRound(shown,quiet,gate){
  S.phase = gate ? 'ready' : 'call'; guessLL=null;
  $('mapWrap').classList.remove('open'); document.body.classList.remove('pinning','pinned');
  $('blankUI').hidden=true; $('card').hidden=false;
  const st = S.rounds[S.i];
  $('kicker').textContent = 'Real or fake?'+(S.kind==='pol'?' · Politics':'')+(S.mode==='practice'?' · practice':'');
  if(gate){
    // nothing is shown, and no clock runs, until the player says they are ready
    $('headline').innerHTML='<span class="fakeplace" style="font-size:.78em;line-height:1.05;display:block">Guess what\'s real, then deduce where it happened. The clock starts when the headline appears.</span>';
    $('speed').hidden=true; $('feedback').hidden=true; $('mapWrap').hidden=true;
    setBar('start');
    const b=$('btnStart'); b.disabled=false; b.textContent="I'm ready";
    if(!S.results.length) Scene.setPaper(false,true);    // he just sits there until you start
    renderDots(); aim();
    return;
  }
  $('headline').innerHTML = headlineHTML(st,false);
  $('speed').hidden=false;
  setBar('call');
  $('feedback').hidden=true;
  $('mapWrap').hidden=true;
  // time already spent on this headline before a reload still counts
  const wall = shown ? shown.wall : Date.now();
  S.t0 = performance.now() - Math.max(0, Date.now()-wall);
  if(!quiet) saveProgress({shown:{i:S.i, wall}});
  runSpeed();
  renderDots();
  aim();
}

function onCall(saysReal){
  if(S.phase!=='call') return;
  const st = S.rounds[S.i];
  const callOk = saysReal === st.real;
  const sec=(performance.now()-S.t0)/1000;
  const pts = st.real ? (callOk?speedPts(sec,st):0) : (callOk?FAKE_PTS:FOOLED_PTS);
  S.cur = {i:S.i, real:st.real, callOk, callPts:pts, pinPts:0, dist:null, sec};
  S.score += pts;
  saveProgress({cur:S.cur});                        // the call sticks even if the page reloads
  revealCall(st);
}

function revealCall(st){
  const c=S.cur, fb=$('feedback');
  $('speed').hidden=true;
  setBar('none');
  if(st.real){
    Scene.gasp();
    if(c.callOk){ Sound.play('real'); Sound.play('jawDown'); } else Sound.play('twist');
    $('kicker').textContent = c.callOk ? 'Real ✓ +'+c.callPts+' · where did it happen?' : 'Plot twist: it\'s real · pin it for half credit';
    fb.hidden=true;
    openMap();
    if(!c.callOk) $('btnGuess').textContent='HALF CREDIT · TAP A REGION';
  } else {
    fb.hidden=false;
    if(c.callOk) Sound.play('catchFake'); else { Sound.play('fooled'); if(jawPoints()>0||S.results.some(x=>x.real)) Sound.play('jawUp'); }
    const tell = st.tell ? '<small>The tell: '+st.tell+'</small>' : '';
    if(c.callOk) fb.innerHTML='<b>Nice catch.</b> That one was invented for this game. +'+FAKE_PTS+'.'+tell;
    else {
      fb.innerHTML='<b>Fooled!</b> That one was invented for this game. −'+Math.abs(FOOLED_PTS)+'.'+tell;

      setTimeout(()=>card.classList.remove('flash'),400);

function submitGuess(){
  if(S.phase!=='pin' || !guessLL) return;
  const st = S.rounds[S.i];
  const d = km(guessLL.lat,guessLL.lng,st.lat,st.lng);
  let pts = pinPoints(d);
  if(!S.cur.callOk) pts = Math.round(pts*0.5);
  S.cur.pinPts = pts; S.cur.dist = d; S.score += pts;
  Sound.play('lock',pts/PIN_PTS); if(pts>0) Sound.play('jawDown');
  const actual = L.latLng(st.lat,st.lng);
  L.polyline([guessLL,actual],{color:'#ffcc4d',weight:2,dashArray:'4 4'}).addTo(layer);
  L.marker(actual,{icon:squareIcon('#4fbf6a'),interactive:false}).addTo(layer);
  map.fitBounds(L.latLngBounds([guessLL,actual]).pad(0.4),{maxZoom:6});
  $('btnGuess').hidden=true;
  $('headline').innerHTML = headlineHTML(st,true);
  $('kicker').textContent = (S.cur.callOk?'Real ✓':'Plot twist: it was real')+(S.kind==='pol'?' · Politics':'');
  const fb=$('feedback'); fb.hidden=false;
  fb.innerHTML = (S.cur.callOk?'<b>+'+S.cur.callPts+'</b> for the call. ':'')
    + 'Your pin was '+Math.round(d).toLocaleString()+' km off: <b>+'+pts+'</b>'+(S.cur.callOk?'':' (half credit)')+'.'
    + '<small>'+(st.clue?'The tell: '+st.clue+'. ':'')+st.place+(st.published?' · '+fmtDate(st.published):'')
    + (st.src?' · <a href="'+st.src+'" target="_blank" rel="noopener">read the story</a>':'')+'</small>';
  finishRound();
  if(!isDesk()) setTimeout(()=>{      // after a moment the map shrinks to a strip so the jaw is not hidden behind it
    if(S && S.phase==='done' && document.body.classList.contains('pinning')){
      document.body.classList.add('pinned');
      setTimeout(()=>{ map.invalidateSize(); map.fitBounds(L.latLngBounds([guessLL,actual]).pad(0.5),{maxZoom:6,animate:false}); aim(); },420);
    }
  },1700);
  setTimeout(()=>{
    if(isDesk()) return;
    const r=fb.getBoundingClientRect(), limit=innerHeight-$('mapWrap').offsetHeight-8;
    if(r.bottom>limit) window.scrollBy({top:r.bottom-limit,behavior:'smooth'});
    else if(r.top<0) window.scrollBy({top:r.top-8,behavior:'smooth'});
  },60);
}

  clearInterval(CD_T);

/* ---------- Shared leaderboard (artifact db) ----------
   scores/<viewer id> holds that viewer's runs keyed "<day>_<mode>" → {m, score, zone}.
   Everyone reads every doc; each viewer writes only their own. */
let DBP=null, USERP=null, DLP=null;
function cap(name){
  if(!window.claude || typeof window.claude.use!=='function') return Promise.resolve(null);
  return window.claude.use(name).catch(()=>null);
}
function getDb(){ return DBP || (DBP=cap('db')); }
function getUser(){ return USERP || (USERP=cap('user')); }
function runKey(kind){ return dayKey()+'_'+kind; }

async function postScore(entry){
  const db=await getDb(), user=await getUser();
  if(!db||!user) return false;
  const id=await user.id(); if(!id) return false;
  const ref=db.doc('scores/'+id);
  try{
    const snap=await ref.get();
    const data=snap.exists ? (snap.data()||{}) : {};
    const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-30);
    const keep={};
    Object.keys(data).forEach(k=>{ if(k.slice(0,10)>=keyOf(cutoff)) keep[k]=data[k]; });
    keep[runKey(entry.kind)]={m:entry.m, score:entry.score, zone:entry.zone, t:Date.now()};
    await ref.set(keep);
    return true;
  }catch(e){ return false; }
}

async function loadBoard(kind){
  const db=await getDb(), user=await getUser();
  if(!db) return null;
  const me=user ? await user.id() : null;
  const snap=await db.collection('scores').limit(1000).get();
  const k=runKey(kind), rows=[];
  snap.forEach ? snap.forEach(d=>{ const v=(d.data()||{})[k]; if(v && typeof v.m==='number') rows.push({id:d.id, m:v.m, score:v.score||0, zone:v.zone||''}); })
              : (snap.docs||[]).forEach(d=>{ const v=(d.data()||{})[k]; if(v && typeof v.m==='number') rows.push({id:d.id, m:v.m, score:v.score||0, zone:v.zone||''}); });
  rows.sort((a,b)=>b.m-a.m || b.score-a.score);
  let names={};
  if(user && rows.length){ try{ const ps=await user.profiles(rows.slice(0,8).map(r=>r.id).concat(me?[me]:[])); Object.keys(ps||{}).forEach(i=>names[i]=ps[i]&&ps[i].name); }catch(e){} }
  return {rows, me, names};
}

/* bell curve of today's depths with your spot marked */
function drawCurve(rows, mine){
  const cv=$('curve'), g=cv.getContext('2d'), W=cv.width, H=cv.height;
  g.imageSmoothingEnabled=false;
  g.fillStyle='#0b0e14'; g.fillRect(0,0,W,H);
  const xs=rows.map(r=>r.m); if(typeof mine==='number') xs.push(mine);
  const maxM=Math.max(2,Math.ceil(Math.max(...xs,1)+1));
  const X=m=>Math.round(14+(W-28)*m/maxM), base=H-22;
  // grid and axis
  g.fillStyle='#1c2230'; for(let m=0;m<=maxM;m++){ g.fillRect(X(m),12,1,base-12); }
  g.fillStyle='#8a91a3'; g.font='10px monospace'; g.textAlign='center';
  for(let m=0;m<=maxM;m+=Math.max(1,Math.round(maxM/6))) g.fillText(m+'m',X(m),H-8);
  g.fillStyle='#3a4050'; g.fillRect(14,base,W-28,2);
  // histogram of players (0.5 m bins)
  const bins={}; rows.forEach(r=>{ const b=Math.floor(r.m*2)/2; bins[b]=(bins[b]||0)+1; });
  const top=Math.max(1,...Object.values(bins));
  Object.keys(bins).forEach(b=>{ const h=Math.round((base-24)*bins[b]/top*0.7); const x0=X(+b), x1=X(+b+0.5);
    g.fillStyle='#2f3a55'; g.fillRect(x0+1,base-h,Math.max(2,x1-x0-2),h); });
  // fitted normal curve
  if(rows.length>=2){
    const mean=rows.reduce((a,r)=>a+r.m,0)/rows.length;
    const sd=Math.max(0.35,Math.sqrt(rows.reduce((a,r)=>a+(r.m-mean)**2,0)/rows.length));
    g.fillStyle='#ffcc4d';
    for(let px=14;px<W-14;px+=2){
      const m=(px-14)/(W-28)*maxM, y=Math.exp(-0.5*((m-mean)/sd)**2);
      g.fillRect(px,Math.round(base-(base-20)*y),2,2);
    }
    g.fillStyle='#ffcc4d'; g.fillRect(X(mean),base+2,1,4);
  }
  // you
  if(typeof mine==='number'){
    const x=X(mine);
    g.fillStyle='#ff6b8b'; g.fillRect(x-1,10,3,base-10);
    g.fillRect(x-14,0,28,11); g.fillStyle='#0b0e14'; g.font='9px monospace'; g.fillText('YOU',x,8);
  }
}

/* ---------- The dig, as a picture and as emoji ---------- */
function digZones(){
  const L=Scene.layout(), chin=13+L.jd+9;
  const z=[['🪑','desk',76],['🧱','basement',L.L0],['🟫','dirt',L.L0+L.B[1]],['🪨','bedrock',L.L0+L.B[2]],['🌋','magma',L.L0+L.B[3]],['💎','core',L.L0+L.B[4]]];
  return {L, chin, passed:z.filter(r=>chin>r[2])};
}
function digEmoji(){
  const inf=Scene.info(), d=digZones();
  if(!d.passed.length) return ['📰😮 🦷 '+inf.m+' m'+(inf.zone==='BEHIND THE PAPER'?' (behind the paper)':'')];
  const lines=['📰😮'];
  d.passed.forEach((r,i)=>lines.push(r[0]+(i===d.passed.length-1?' 🦷 '+inf.m+' m':'')));
  return lines;
}
function renderDigCard(){
  const d=digZones(), L=d.L, inf=Scene.info();
  const w=60, h=100, c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d');
  const top=-14, bottom=Math.max(L.L0+L.B[4]+20, d.chin+20), Y=y=>Math.round(2+ (y-top)/(bottom-top)*(h-14));
  const bands=[[top,'#3d3148'],[74,'#8a5a3a'],[80,'#6a432b'],[L.FLOOR,'#6b4430'],[L.L0,'#2d2b38'],[L.L0+L.B[1],'#4d3426'],[L.L0+L.B[2],'#5b5a66'],[L.L0+L.B[3],'#b32d14'],[L.L0+L.B[4],'#3a0a06']];
  bands.forEach(([y0,col],i)=>{ const y1=i<bands.length-1?bands[i+1][0]:bottom; g.fillStyle=col; g.fillRect(0,Y(y0),w,Math.max(1,Y(y1)-Y(y0))); });
  g.fillStyle='#ffd23f'; g.fillRect(w/2-3,Y(L.L0+L.B[4])+4,6,4);
  const cx=w/2;
  g.fillStyle='#f2c9a0'; g.fillRect(cx-4,Y(-10),8,Y(13)-Y(-10));
  g.fillStyle='#4a2e1f'; g.fillRect(cx-4,Y(-10),8,2);
  g.fillStyle='#23232e'; g.fillRect(cx-3,Y(2),2,1); g.fillRect(cx+1,Y(2),2,1);
  const cy=Y(d.chin);
  g.fillStyle='#f2c9a0'; g.fillRect(cx-3,Y(13),6,Math.max(1,cy-Y(13)));
  g.fillStyle='#2a0c14'; g.fillRect(cx-2,Y(13),4,Math.max(1,cy-Y(13)-1));
  g.fillStyle='#f4f0e4'; g.fillRect(cx-3,cy-1,6,1);
  g.fillStyle='#f2c9a0'; g.fillRect(cx-3,cy,6,2);
  g.fillStyle='#efe6cf'; g.fillRect(cx-8,Y(L.PB0>0?24:24),16,Math.max(2,Y(L.PB0)-Y(24)));
  g.fillStyle='#2b2b30'; g.fillRect(cx-7,Y(24)+1,14,1);
  g.fillStyle='#ff6b8b'; g.fillRect(w-6,cy,5,1);
  g.fillStyle='#0b0e14'; g.fillRect(0,h-11,w,11);
  // scale up crisply with a caption strip
  const big=document.createElement('canvas'); big.width=w*4; big.height=h*4;
  const bg=big.getContext('2d'); bg.imageSmoothingEnabled=false; bg.drawImage(c,0,0,big.width,big.height);
  bg.fillStyle='#0b0e14'; bg.fillRect(0,big.height-44,big.width,44);
  bg.fillStyle='#ffcc4d'; bg.font='bold 18px monospace'; bg.textAlign='center';
  bg.fillText((S.mode==='daily'?'FAR-FETCHED #'+dayNumber():'FAR-FETCHED'),big.width/2,big.height-26);
  bg.fillStyle='#eef0f4'; bg.font='16px monospace';
  bg.fillText(inf.m+' m · '+(inf.zone==='NOWHERE'?'jaw shut':inf.zone.toLowerCase()),big.width/2,big.height-8);
  S.digPng=big.toDataURL('image/png');
  $('digImg').src=S.digPng;
  $('digCap').textContent='Your dig: '+inf.m+' m'+(inf.zone==='NOWHERE'?'':' to '+inf.zone.toLowerCase())+'. Score '+fmtPts(S.total)+'.';
}
function dataUrlBlob(u){ const b=atob(u.split(',')[1]), a=new Uint8Array(b.length); for(let i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return new Blob([a],{type:'image/png'}); }
async function saveDigImage(){
  if(!S.digPng) renderDigCard();
  const name='far-fetched-'+dayKey()+'-'+S.kind+'.png', blob=dataUrlBlob(S.digPng), msg=$('saveMsg');
  const dl=await cap('downloads');
  if(dl){
    try{ await dl.save({filename:name, data:blob}); msg.textContent='Saved.'; }
    catch(e){ msg.textContent = e && e.code==='declined' ? '' : 'Saving isn\'t available here. Long-press the picture to keep it.'; }
    return;
  }
  try{ const a=document.createElement('a'); a.href=S.digPng; a.download=name; document.body.append(a); a.click(); a.remove(); msg.textContent='Saved.'; }
  catch(e){ msg.textContent='Long-press the picture to keep it.'; }
}

/* ---------- Zone toast (replaces the edge labels) ---------- */
let TOAST_T=0;
function showToast(txt){
  const el=$('toast'); el.textContent=txt; el.hidden=false; el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
  clearTimeout(TOAST_T); TOAST_T=setTimeout(hideToast,3600);
}
function hideToast(){ $('toast').hidden=true; }

/* ---------- Fill the Blank mode ----------
   Word closeness comes from GloVe word vectors (words.json, 45k words, loaded on first use). */
let VM = null, VLOAD = null, TIMER = null;

function loadVectors(){
  if(VLOAD) return VLOAD;
  VLOAD = fetch('words.json').then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(j=>{
      const words=j.words.split('\n'), n=j.n, d=j.d;
      const raw=atob(j.data), arr=new Int8Array(n*d);
      for(let i=0;i<arr.length;i++) arr[i]=(raw.charCodeAt(i)<<24)>>24;
      const norms=new Float32Array(n);
      for(let i=0;i<n;i++){ let q=0; for(let k=0;k<d;k++){ const x=arr[i*d+k]; q+=x*x; } norms[i]=Math.sqrt(q)||1; }
      const map=new Map(); words.forEach((w,i)=>map.set(w,i));
      VM={map,arr,norms,d};
    })
    .catch(e=>{ VLOAD=null; throw e; });
  return VLOAD;
}
function cosIdx(i,j){
  const d=VM.d, a=VM.arr; let dot=0;
  for(let k=0;k<d;k++) dot+=a[i*d+k]*a[j*d+k];
  return dot/(VM.norms[i]*VM.norms[j]);
}
function stem(w){
  if(w.endsWith('ies')&&w.length>4) return w.slice(0,-3)+'y';
  if(w.endsWith('oes')) return w.slice(0,-2);
  if(w.endsWith('ves')) return w.slice(0,-3)+'f';
  if(w.endsWith('s')&&!w.endsWith('ss')) return w.slice(0,-1);
  return w;
}
function vecOf(st){
  if(st._v!==undefined) return st._v;
  st._v=null;
  if(st.vec){ try{ const raw=atob(st.vec), a=new Int8Array(raw.length); let n=0;
    for(let i=0;i<raw.length;i++){ a[i]=(raw.charCodeAt(i)<<24)>>24; n+=a[i]*a[i]; }
    if(a.length===VM.d) st._v={a,n:Math.sqrt(n)||1}; }catch(e){} }
  return st._v;
}
/* returns closeness 0..1 (1 = exact) or null if the word isn't in the list */
function closeness(word, st){
  if(st.ans.some(a=>stem(a)===stem(word))) return 1;
  const gi=VM.map.get(word);
  if(gi===undefined) return null;
  let cs=-1;
  st.ans.forEach(a=>{ const ai=VM.map.get(a); if(ai!==undefined) cs=Math.max(cs,cosIdx(gi,ai)); });
  const sv=vecOf(st);
  if(sv){ const d=VM.d, A=VM.arr; let dot=0; for(let k=0;k<d;k++) dot+=A[gi*d+k]*sv.a[k]; cs=Math.max(cs,dot/(VM.norms[gi]*sv.n)); }
  if(cs<-0.99) return null;
  return Math.max(0,Math.min(0.95,(cs-0.15)/0.75));
}
function fmtDate(iso){ try{ const p=iso.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]).toLocaleDateString(undefined,{month:'short',day:'numeric'}); }catch(e){ return iso; } }
/* Exact answers carry the round; near misses pay little so spamming related words doesn't. */
function blankPts(c,tl,n){
  const pace=0.6+0.4*tl/BLANK_SECS, spam=Math.max(0.5,1-0.05*Math.max(0,n-3));
  return Math.round((c>=1 ? BLANK_MAX*pace : 300*c*c*pace)*spam);
}
function heat(c){ return c>=1?'EXACT':c>=0.8?'HOT':c>=0.6?'WARM':c>=0.4?'MILD':'COLD'; }

function blankHTML(st,reveal){
  const w = 70 + (hash(st.h2) % 60);
  const bar = '<span class="redact" role="img" aria-label="word hidden" style="width:'+w+'px"></span>';
  return st.h2.replace('[]', reveal ? '<span class="reveal">'+st.ans[0]+'</span>' : bar);
}
function stopTimer(){ if(TIMER){ clearInterval(TIMER); TIMER=null; } }

function showBlankRound(live){
  S.phase='ready'; S.blank=null;
  $('mapWrap').classList.remove('open'); document.body.classList.remove('pinning','pinned');
  $('card').hidden=false; $('speed').hidden=true;
  $('feedback').hidden=true; $('mapWrap').hidden=true;
  $('blankUI').hidden=false; $('blankLive').hidden=true;
  $('kicker').textContent='Fill the blank'+(S.mode==='practice'?' · practice':'');
  $('headline').innerHTML='<span class="fakeplace">'+(S.results.length ? 'Ready for the next one? One word is hidden. 20 seconds.' : 'One word is hidden. You get 20 seconds and as many guesses as you like. The exact word scores most, and faster is better.')+'</span>';
  setBar('start');
  if(!S.results.length && !live) Scene.setPaper(false,true);
  const b=$('btnStart'); b.disabled=true; b.textContent='Loading word list…';
  renderDots();
  aim();
  loadVectors().then(()=>{
    if(S.phase!=='ready' || S.kind!=='blank') return;
    b.disabled=false; b.textContent='Start · 20 seconds';
    if(live) startBlankRound(live.wall);     // a round started before a reload keeps running on the same clock
  }).catch(()=>{
    b.disabled=true;
    b.textContent = 'Word list failed to load. Reload the page.';
  });
}

function startBlankRound(wall){
  if(S.phase!=='ready' || !VM) return;
  S.phase='live';
  Scene.setPaper(true);
  const st=S.rounds[S.i];
  const w = typeof wall==='number' ? wall : Date.now();
  S.blank={t0:performance.now()-Math.max(0,Date.now()-w), guesses:[], seen:new Set(), bestC:0, bestPts:0, bestWord:'', exact:false};
  saveProgress({live:{i:S.i, wall:w}});
  if(typeof wall!=='number') Sound.play('start');
  S.blank.lastSec=Math.ceil(BLANK_SECS);
  $('headline').innerHTML=blankHTML(st,false);
  $('blankLive').hidden=false; setBar('guess');
  $('guessList').innerHTML=''; $('guessMsg').textContent='';
  const inp=$('guessIn'); inp.value=''; inp.focus();
  updateTimer();
  TIMER=setInterval(updateTimer,50);
  aim();
}

function updateTimer(){
  if(!S.blank || S.phase!=='live') return;
  const tl=Math.max(0,BLANK_SECS-(performance.now()-S.blank.t0)/1000);
  $('timerBar').style.width=(tl/BLANK_SECS*100)+'%';
  $('timerNum').textContent=tl>=10?Math.ceil(tl):tl.toFixed(1);
  $('timerBar').classList.toggle('low',tl<4);
  const sec=Math.ceil(tl);
  if(sec!==S.blank.lastSec){ S.blank.lastSec=sec; if(sec<=5 && sec>0) Sound.play('tick'); }
  if(tl<=0){ Sound.play('timeup'); endBlank(); }
}

function submitWord(raw){
  if(S.phase!=='live') return;
  const word=(raw||'').toLowerCase().replace(/[^a-z]/g,'');
  if(!word) return;
  const bl=S.blank, st=S.rounds[S.i];
  const msg=$('guessMsg');
  if(bl.seen.has(word)){ msg.textContent='Already guessed "'+word+'".'; return; }
  const c=closeness(word,st);
  if(c===null){ msg.textContent='"'+word+'" isn\'t in the word list.'; Sound.play('nope'); return; }
  msg.textContent='';
  const tl=Math.max(0,BLANK_SECS-(performance.now()-bl.t0)/1000);
  bl.seen.add(word);
  bl.guesses.push({word,c});
  const pts=blankPts(c,tl,bl.guesses.length);
  if(pts>bl.bestPts || !bl.bestWord){ bl.bestPts=pts; bl.bestC=c; bl.bestWord=word; }
  renderGuesses();
  if(c>=1){ bl.exact=true; Sound.play('exact'); endBlank(); } else Sound.play('guess',c);
}

function renderGuesses(){
  const bl=S.blank;
  const sorted=bl.guesses.slice().sort((a,b)=>b.c-a.c).slice(0,3);
  const lastW=bl.guesses.length?bl.guesses[bl.guesses.length-1].word:'';
  $('guessList').innerHTML=sorted.map(x=>{
    const h=heat(x.c), cl=h.toLowerCase();
    return '<span class="chip '+cl+(x.word===lastW?' new':'')+'">'+x.word+' <b>'+h+'</b></span>';
  }).join('')+(bl.guesses.length>3?'<span class="chip more">+'+(bl.guesses.length-3)+'</span>':'');
}

function endBlank(){
  if(S.phase!=='live') return;
  stopTimer();
  S.phase='done';
  const bl=S.blank, st=S.rounds[S.i];
  const res={blank:true, real:st.real, c:bl.bestC, callOk:bl.bestC>=0.5, callPts:bl.bestPts, pinPts:0, callWord:bl.bestWord};
  S.score+=res.callPts;
  if(res.callPts>0){ Scene.gasp(); Sound.play('jawDown'); }
  $('blankLive').hidden=true;
  $('guessIn').blur();
  $('headline').innerHTML=blankHTML(st,true);
  const fb=$('feedback'); fb.hidden=false;
  let line;
  if(bl.exact) line='<b>Exact!</b> +'+res.callPts+'.';
  else if(bl.bestWord) line='Time. Closest: <b>'+bl.bestWord+'</b> ('+heat(bl.bestC).toLowerCase()+') for +'+res.callPts+'.';
  else line='Time. No guesses landed.';
  fb.innerHTML=line+'<small>'+st.place+(st.published?' · '+fmtDate(st.published):'')+(st.src?' · <a href="'+st.src+'" target="_blank" rel="noopener">read the story</a>':'')+'</small>';
  S.results.push(res);
  saveProgress();
  const last=S.i===S.rounds.length-1;
  $('btnNext').textContent=last?'See results':'Next headline';
  setBar('next');
  renderDots();
  aim();
}

/* keep the bottom bar above the on-screen keyboard */
if(window.visualViewport){
  const lift=()=>{ const vv=visualViewport; const off=Math.max(0,innerHeight-vv.height-vv.offsetTop); $('bar').style.bottom=off+'px'; };
  visualViewport.addEventListener('resize',lift); visualViewport.addEventListener('scroll',lift);
}

$('btnReal').onclick=()=>onCall(true);
$('btnFake').onclick=()=>onCall(false);

renderAmb();
$('btnPractice').onclick=()=>startGame('practice',KIND==='pol'?'call':KIND);
function closeMenu(){ document.body.classList.remove('hideq'); $('menu').hidden=true; $('menuBtn').setAttribute('aria-expanded','false'); }
$('menuBtn').onclick=e=>{ e.stopPropagation(); Sound.play('menu'); const open=$('menu').hidden; $('menu').hidden=!open; document.body.classList.toggle('hideq',open && !!S && S.phase==='call'); $('menuBtn').setAttribute('aria-expanded',String(open)); if(open) renderStats(); };
$('menu').addEventListener('click',e=>e.stopPropagation());
document.addEventListener('click',closeMenu);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(RECAP_ON) endRecapUI(true); closeMenu(); $('sheet').hidden=true; return; }
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const t=e.target; if(t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA')) return;
  if(!$('sheet').hidden || !$('menu').hidden || !S) return;
  const k=e.key.toLowerCase();
  if(S.phase==='call' && S.kind!=='blank' && (k==='r'||k==='f')){ e.preventDefault(); onCall(k==='r'); return; }
  if((e.key==='Enter'||e.key===' ') && !(document.activeElement && document.activeElement.tagName==='BUTTON')){
    const b=[$('btnStart'),$('btnNext'),$('btnNext2'),$('btnGuess')].find(x=>x && !x.hidden && !x.disabled && x.offsetParent!==null);
    if(b){ e.preventDefault(); b.click(); }
  }
});
$('mCall').onclick=()=>startGame('daily','call');
$('mBlank').onclick=()=>startGame('daily','blank');
$('mPol').onclick=()=>startGame('daily','pol');
$('mPractice').onclick=()=>startGame('practice',KIND==='pol'?'call':KIND);

Scene.onDepth(m=>{ $('depth').textContent=m; });
Scene.onZone(name=>showToast(name));
Scene.onBreak(z=>{ Sound.play('crunch'); if(z>=5) Sound.play('core'); });
Scene.onRumble(l=>Sound.rumble(l));
function renderMute(){ const m=Sound.isMuted(); $('muteBtn').classList.toggle('off',m); $('muteBtn').setAttribute('aria-pressed',String(m)); $('muteBtn').setAttribute('aria-label',m?'Sound off':'Sound on'); }
$('muteBtn').onclick=e=>{ e.stopPropagation(); Sound.setMuted(!Sound.isMuted()); renderMute(); if(!Sound.isMuted()) Sound.play('menu'); };
renderMute();
Scene.start();
updateStreak();
loadDaily().finally(()=>startGame('daily',KIND));
window.addEventListener('resize',()=>{ clearTimeout(window._aimT); window._aimT=setTimeout(()=>aim(),200); });
